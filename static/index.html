<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Processor Web App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <h1>JSON Processor</h1>
            </div>
            <p>Enter valid JSON data below to process it on the Python backend.</p>
        </header>

        <main class="main-content">
            <section class="input-section panel">
                <h2>Input Payload</h2>
                <form id="json-form">
                    <div class="editor-container">
                        <textarea id="json-input" spellcheck="false" placeholder='{\n  "message": "Hello World",\n  "count": 5,\n  "items": [1, 2, 3]\n}'></textarea>
                    </div>
                    <div class="actions">
                        <span id="error-message" class="error-text"></span>
                        <button type="submit" class="btn-primary" id="submit-btn">
                            <span>Process JSON</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>
            </section>

            <section class="output-section panel">
                <h2>Backend Response</h2>
                <div class="output-container">
                    <div id="loading-spinner" class="spinner hidden"></div>
                    <pre id="json-output" class="language-json"><code class="placeholder">Awaiting input...</code></pre>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
